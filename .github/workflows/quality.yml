name: Kaveh Quality Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python contract and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Kaveh package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run Kaveh tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/kaveh -p 'test_*.py' -v
      - name: Verify CLI surface
        env:
          PYTHONPATH: src
        run: python -m kaveh --help
