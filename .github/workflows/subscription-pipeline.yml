name: Pusheen V2Ray Subscription Pipeline

on:
  schedule:
    # Off-hour minute slots avoid the heaviest GitHub Actions scheduler window.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pusheen-v2ray-subscription-pipeline
  cancel-in-progress: false

jobs:
  validate-and-publish:
    # Set repository variable KAVEH_AUTOMATION_ENABLED=true only after the
    # required secret and variables are configured.
    if: github.event_name == 'workflow_dispatch' || vars.KAVEH_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Eight sequential Xray probes leave headroom for setup, ingest, and commit
    # inside the 15-minute schedule interval.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Restore pinned Xray binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/xray
          key: xray-linux-64-v26.3.27-sha256-23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
      - name: Install Kaveh
        run: python -m pip install .
      - name: Install pinned Xray on cache miss
        run: scripts/install_xray_ci.sh .tools/xray
      - name: Validate and build subscriptions
        env:
          KAVEH_DATABASE_URL: ${{ secrets.KAVEH_DATABASE_URL }}
          KAVEH_PROBE_URL: ${{ vars.KAVEH_PROBE_URL }}
          KAVEH_VANTAGE_ID: ${{ vars.KAVEH_VANTAGE_ID }}
          KAVEH_CANDIDATE_LIMIT: ${{ vars.KAVEH_CANDIDATE_LIMIT }}
          XRAY_BINARY: ${{ github.workspace }}/.tools/xray/xray
          XRAY_STARTUP_TIMEOUT_SECONDS: "5"
          XRAY_PROBE_TIMEOUT_SECONDS: "8"
          XRAY_WORK_ROOT: .artifacts/xray
        run: |
          set -euo pipefail
          test -n "${KAVEH_DATABASE_URL}"
          test -n "${KAVEH_PROBE_URL}"
          test -n "${KAVEH_VANTAGE_ID}"
          # An eight-candidate default broadens coverage while keeping a
          # worst-case sequential Xray run below the job budget.
          requested_limit="${KAVEH_CANDIDATE_LIMIT:-8}"
          limit="${requested_limit}"
          if [ "${limit}" -gt 8 ] 2>/dev/null; then
            echo "Capping KAVEH_CANDIDATE_LIMIT at 8 to preserve the 15-minute schedule budget."
            limit=8
          fi
          case "${limit}" in
            ''|*[!0-9]*) echo "KAVEH_CANDIDATE_LIMIT must be a positive integer" >&2; exit 1 ;;
          esac
          test "${limit}" -ge 1
          python -m kaveh validate \
            --registry configs/sources/registry.v1.json \
            --limit "${limit}" \
            --publish-root .
      - name: Commit subscription changes only
        run: |
          set -euo pipefail
          git add -A -- subscriptions
          if [ -d snapshots ]; then
            git add -A -- snapshots
          fi
          if [ -f latest.txt ]; then
            git add -A -- latest.txt
          fi
          if git diff --cached --quiet; then
            echo "No qualified subscription change; no commit created."
            exit 0
          fi
          git config user.name "pusheen-v2ray-bot[bot]"
          git config user.email "pusheen-v2ray-bot[bot]@users.noreply.github.com"
          git commit -m "chore(subscription): publish qualified feed"
          git push
