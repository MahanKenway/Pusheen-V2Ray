name: Pusheen V2Ray Subscription Pipeline

on:
  schedule:
    # Off-hour minute slots avoid the heaviest GitHub Actions scheduler window.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pusheen-v2ray-subscription-pipeline
  cancel-in-progress: false

jobs:
  validate-and-publish:
    # Set repository variable KAVEH_AUTOMATION_ENABLED=true only after the
    # required secret and variables are configured.
    if: github.event_name == 'workflow_dispatch' || vars.KAVEH_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Eight candidates are processed with four bounded workers, preserving
    # end-to-end evidence while leaving headroom inside the 15-minute interval
    # even when newly discovered endpoints require full probe timeouts.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Restore pinned Xray binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/xray
          key: xray-linux-64-v26.3.27-sha256-23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
      - name: Restore pinned sing-box binary
        id: cache-singbox
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/sing-box
          key: sing-box-linux-amd64-v1.13.19-sha256-ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1
      - name: Install Kaveh
        run: python -m pip install .
      - name: Install pinned Xray on cache miss
        run: scripts/install_xray_ci.sh .tools/xray
      - name: Install pinned sing-box on cache miss
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        run: scripts/install_singbox_ci.sh .tools/sing-box
      - name: Validate and build subscriptions
        env:
          KAVEH_DATABASE_URL: ${{ secrets.KAVEH_DATABASE_URL }}
          KAVEH_PROBE_URL: ${{ vars.KAVEH_PROBE_URL }}
          KAVEH_PROBE_FALLBACK_URL: "https://www.cloudflare.com/cdn-cgi/trace"
          KAVEH_VANTAGE_ID: ${{ vars.KAVEH_VANTAGE_ID }}
          KAVEH_CANDIDATE_LIMIT: ${{ vars.KAVEH_CANDIDATE_LIMIT }}
          KAVEH_RELEASE_SIGNING_KEY: ${{ secrets.KAVEH_RELEASE_SIGNING_KEY }}
          KAVEH_VALIDATION_WORKERS: "4"
          XRAY_BINARY: ${{ github.workspace }}/.tools/xray/xray
          SINGBOX_BINARY: ${{ github.workspace }}/.tools/sing-box/sing-box
          XRAY_STARTUP_TIMEOUT_SECONDS: "5"
          XRAY_PROBE_TIMEOUT_SECONDS: "8"
          XRAY_WORK_ROOT: .artifacts/xray
        run: |
          set -euo pipefail
          test -n "${KAVEH_DATABASE_URL}"
          test -n "${KAVEH_PROBE_URL}"
          test -n "${KAVEH_VANTAGE_ID}"
          # Bounded parallel validation improves strict-feed discovery without
          # weakening the end-to-end requirement or exceeding the job budget.
          requested_limit="${KAVEH_CANDIDATE_LIMIT:-8}"
          limit="${requested_limit}"
          if [ "${limit}" -gt 8 ] 2>/dev/null; then
            echo "Capping KAVEH_CANDIDATE_LIMIT at 8 to preserve the 15-minute schedule budget."
            limit=8
          fi
          case "${limit}" in
            ''|*[!0-9]*) echo "KAVEH_CANDIDATE_LIMIT must be a positive integer" >&2; exit 1 ;;
          esac
          test "${limit}" -ge 1
          python -m kaveh validate \
            --registry configs/sources/registry.v1.json \
            --limit "${limit}" \
            --publish-root .
      - name: Validate generated Xray failover profile
        run: |
          set -euo pipefail
          test -s profiles/resilient-xray.json
          .tools/xray/xray run -test -c profiles/resilient-xray.json
      - name: Validate generated sing-box outage profile
        run: |
          set -euo pipefail
          test -s profiles/outage-singbox.json
          .tools/sing-box/sing-box check -c profiles/outage-singbox.json
      - name: Commit subscription changes only
        run: |
          set -euo pipefail
          git add -A -- subscriptions
          if [ -d profiles ]; then
            git add -A -- profiles
          fi
          git add -- status.json
          if [ -d snapshots ]; then
            git add -A -- snapshots
          fi
          if [ -d releases ]; then
            git add -A -- releases
          fi
          if [ -f latest.txt ]; then
            git add -A -- latest.txt
          fi
          if git diff --cached --quiet; then
            echo "No qualified subscription change; no commit created."
            exit 0
          fi
          git config user.name "pusheen-v2ray-bot[bot]"
          git config user.email "pusheen-v2ray-bot[bot]@users.noreply.github.com"
          git commit -m "chore(subscription): refresh validated feeds and status"
          # A manual code change may land while validation is running. Rebase the
          # generated artifact commit before publication instead of losing it to
          # a non-fast-forward push rejection.
          git pull --rebase origin main
          git push
