<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hiddify subscription import steps</title>
  <desc id="desc">Three numbered cards: open plus, choose Add manually, paste the Pusheen feed URL and save.</desc>
  <rect width="1200" height="420" rx="28" fill="#f7efe5"/>
  <text x="60" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#33271d">Hiddify · Add a Pusheen feed</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(50 100)"><rect width="330" height="250" rx="22" fill="#fffaf4" stroke="#d8bfa6" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#ee8ca6"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><text x="95" y="58" font-size="22" font-weight="700" fill="#33271d">Open Home</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e8ded2"/><circle cx="165" cy="147" r="30" fill="#fffaf4" stroke="#8d7868" stroke-width="4"/><path d="M165 132v30M150 147h30" stroke="#33271d" stroke-width="6" stroke-linecap="round"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#665447">Tap +</text></g>
    <g transform="translate(435 100)"><rect width="330" height="250" rx="22" fill="#fffaf4" stroke="#d8bfa6" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#ee8ca6"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><text x="95" y="58" font-size="22" font-weight="700" fill="#33271d">Add manually</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e8ded2"/><rect x="83" y="125" width="164" height="42" rx="8" fill="#fffaf4" stroke="#8d7868" stroke-width="3"/><text x="165" y="152" text-anchor="middle" font-size="16" fill="#665447">Name · URL · Save</text><text x="165" y="222" text-anchor="middle" font-size="18" fill="#665447">Choose Add manually</text></g>
    <g transform="translate(820 100)"><rect width="330" height="250" rx="22" fill="#fffaf4" stroke="#d8bfa6" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#ee8ca6"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="95" y="58" font-size="22" font-weight="700" fill="#33271d">Paste &amp; save</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e8ded2"/><path d="M80 135h170M80 158h120" stroke="#8d7868" stroke-width="6" stroke-linecap="round"/><circle cx="245" cy="169" r="12" fill="#76b995"/><path d="m239 169 5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#665447">Update and test delay</text></g>
  </g>
</svg>
