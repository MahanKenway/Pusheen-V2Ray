  <g font-family="Arial,sans-serif"><g transform="translate(50 100)"><rect width="330" height="250" rx="22" fill="#fbfdff" stroke="#a9c9e2" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#4d9bd1"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><text x="95" y="58" font-size="22" font-weight="700" fill="#1c3347">Subscription groups</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#dcecf8"/><rect x="86" y="125" width="158" height="13" rx="6" fill="#6fa8d2"/><rect x="86" y="151" width="125" height="13" rx="6" fill="#9bc4df"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#496b83">Open the group list</text></g>
  <g transform="translate(435 100)"><rect width="330" height="250" rx="22" fill="#fbfdff" stroke="#a9c9e2" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#4d9bd1"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><text x="95" y="58" font-size="22" font-weight="700" fill="#1c3347">Add a group</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#dcecf8"/><path d="M92 147h146M165 120v54" stroke="#1c3347" stroke-width="7" stroke-linecap="round"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#496b83">Paste the feed URL</text></g>
  <g transform="translate(820 100)"><rect width="330" height="250" rx="22" fill="#fbfdff" stroke="#a9c9e2" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#4d9bd1"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="95" y="58" font-size="22" font-weight="700" fill="#1c3347">Update &amp; choose</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#dcecf8"/><path d="M110 147a55 55 0 1 1 18 39" fill="none" stroke="#4d9bd1" stroke-width="8"/><path d="m95 187 33 0-15-28" fill="#4d9bd1"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#496b83">Update, test, then connect</text></g></g>
