<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">v2rayNG subscription import steps</title><desc id="desc">Three numbered cards: open subscriptions, add a group URL, update and select a node.</desc>
