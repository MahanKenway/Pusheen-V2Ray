<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sing-box profile import steps</title><desc id="desc">Three numbered cards: download JSON, import profile, run URLTest.</desc>
  <rect width="1200" height="420" rx="28" fill="#f1effb"/><text x="60" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#352d5b">Sing-box · Import outage profile</text>
  <g font-family="Arial,sans-serif"><g transform="translate(50 100)"><rect width="330" height="250" rx="22" fill="#fcfbff" stroke="#bdb4e4" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#8778c9"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><text x="95" y="58" font-size="22" font-weight="700" fill="#352d5b">Get JSON</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e6e1f7"/><path d="M165 120v47M145 148l20 20 20-20" fill="none" stroke="#554a91" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="173" width="78" height="8" rx="4" fill="#8778c9"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#625b83">Download outage-singbox.json</text></g>
  <g transform="translate(435 100)"><rect width="330" height="250" rx="22" fill="#fcfbff" stroke="#bdb4e4" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#8778c9"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><text x="95" y="58" font-size="22" font-weight="700" fill="#352d5b">Import profile</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e6e1f7"/><rect x="110" y="121" width="110" height="58" rx="8" fill="#fcfbff" stroke="#625b83" stroke-width="4"/><path d="M133 140h64M133 155h48" stroke="#8778c9" stroke-width="6" stroke-linecap="round"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#625b83">Use Import / Open file</text></g>
  <g transform="translate(820 100)"><rect width="330" height="250" rx="22" fill="#fcfbff" stroke="#bdb4e4" stroke-width="3"/><circle cx="48" cy="50" r="27" fill="#8778c9"/><text x="48" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="95" y="58" font-size="22" font-weight="700" fill="#352d5b">Run URLTest</text><rect x="55" y="105" width="220" height="85" rx="14" fill="#e6e1f7"/><circle cx="165" cy="147" r="28" fill="none" stroke="#8778c9" stroke-width="8"/><path d="M165 130v20l14 10" fill="none" stroke="#554a91" stroke-width="6" stroke-linecap="round"/><text x="165" y="222" text-anchor="middle" font-size="18" fill="#625b83">Select the best tested route</text></g></g>
